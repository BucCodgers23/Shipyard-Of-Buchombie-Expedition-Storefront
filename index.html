        .matrix-title { text-align: center; border-bottom: 2px solid var(--neon-cyan); padding-bottom: 18px; letter-spacing: 2px; font-size: 1.4rem; color: #ffffff; text-shadow: 0 0 8px var(--neon-cyan); }

        .vendor-card { border: 1px solid var(--neon-cyan); padding: 22px; border-radius: 6px; background: var(--panel-bg); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 5px 15px rgba(0, 255, 204, 0.08); }
        .metadata-uri { word-break: break-all; color: #8a99ad; font-size: 11px; background: #0f1217; padding: 6px; border-radius: 3px; border: 1px solid #1c232f; }
        .price-matrix { font-size: 1.2rem; color: var(--gold-cost); font-weight: bold; margin: 15px 0 8px 0; }
        .active-vendor-btn { background: var(--neon-cyan); color: #0f1115; border: 1px solid var(--neon-cyan); padding: 14px 20px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; border-radius: 4px; font-family: 'Courier New', Courier, monospace; font-size: 12px; letter-spacing: 1px; }
    </style>
</head>

const gridDisplay = document.getElementById("vendor-matrix-zone");
voucherCatalog.forEach(work => {
    let badgeText = "⚓ VAULT ESCROW";
    let badgeColor = "var(--neon-cyan)";
    let badgeBg = "#112222";
    let clickableStyle = "";
    let clickAction = "";

    if (work.id === 1) { badgeText = "🔥 TRAILER SPECIAL"; badgeColor = "var(--hot-pink)"; badgeBg = "#2c141d"; }
    else if (work.id === 7) { badgeText = "👑 OPTIMUM CORE"; badgeColor = "var(--gold-cost)"; badgeBg = "#2a2215"; }

    if (work.videoUrl && work.videoUrl.trim() !== "") {
        badgeText += " ➔ [PREVIEW]";
        clickableStyle = "cursor: pointer;";
        clickAction = `onclick="window.open('${work.videoUrl}', '_blank')"`;
    }

    gridDisplay.innerHTML += `
        <div class="vendor-card">
            <div>
                <div ${clickAction} style="display: inline-block; padding: 5px 10px; background: ${badgeBg}; color: ${badgeColor}; border: 1px solid ${badgeColor}; font-size: 10px; font-weight: bold; margin-bottom: 12px; border-radius: 3px; ${clickableStyle}">
                    ${badgeText}
                </div>
                <h3>Work Slot #${work.id}</h3>
                <p style="color: #ffffff; font-weight: bold; margin-bottom: 12px;">${work.name}</p>
                <div class="metadata-uri">${work.ipfs}</div>
            </div>
            <div>
                <p class="price-matrix">24,543 POL</p>
                <button class="active-vendor-btn" onclick="triggerWeb3Activation(${work.id}, '${work.ipfs}', '${work.proof}')">EXECUTE VOUCHER PURCHASE</button>
            </div>
        </div>
    `;
});

async function triggerWeb3Activation(slotId, assetUri, sigProof) {
    if (!window.ethereum) { alert("Web3 Environment Undetected."); return; }
    try {
        const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        await web3Provider.send("eth_requestAccounts", []);
        const signerInstance = web3Provider.getSigner();
        const contractInstance = new ethers.Contract(targetContractAddress, voucherAbi, signerInstance);
        const tx = await contractInstance.redeem(await signerInstance.getAddress(), { tokenId: slotId, minPrice: "24543000000000000000000", uri: assetUri, signature: sigProof }, { value: "24543000000000000000000" });
        alert("Initialised! Tx Hash: " + tx.hash);
    } catch(err) { alert("Interrupted: " + err.message); }
}
</script>
