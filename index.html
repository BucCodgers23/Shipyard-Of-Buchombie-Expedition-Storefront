            --border-dim: #262e3d;
            --gold-cost: #f5c068;

        body {

            background: var(--deep-bg);

            padding: 20px;

            font-size: 13px;

        .matrix-title {

        .global-alert {

            color: var(--hot-pink); 
            margin: 20px auto 30px auto;

            padding: 10px; 
            border: 1px dashed var(--hot-pink); 
            border-radius: 4px; 
            max-width: 600px;
        }
        .showcase-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .vendor-card { 
            border: 1px solid var(--neon-cyan); 
            padding: 22px; 
            border-radius: 6px; 
            background: var(--panel-bg); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .vendor-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.15);
        }
        .vendor-card h3 { 
            margin: 0 0 10px 0; 
            border-bottom: 1px solid var(--border-dim); 
            padding-bottom: 8px; 
            color: #ffffff; 
            font-size: 1.1rem;
        }
        .metadata-uri { 
            word-break: break-all; 
            color: #8a99ad; 
            font-size: 11px;
            background: #0f1217;
            padding: 6px;
            border-radius: 3px;
            border: 1px solid #1c232f;
        }
        .price-matrix { 
            font-size: 1.2rem; 
            color: var(--gold-cost); 
            font-weight: bold;
            margin: 15px 0 8px 0;

        /* The Web3 Active Vendor Button Style */
        .active-vendor-btn {

            color: #0f1115; 
            border: 1px solid var(--neon-cyan); 
            padding: 14px 20px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 12px; 
            border-radius: 4px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .active-vendor-btn:hover { 
            background: #ffffff; 
            border-color: #ffffff;
            box-shadow: 0 0 15px var(--neon-cyan);

const gridDisplay = document.getElementById("vendor-matrix-zone");
voucherCatalog.forEach(work => {

                    EXECUTE VOUCHER PURCHASE
                </button>

    `;
});

async function triggerWeb3Activation(slotId, assetUri, sigProof) {
    if (!window.ethereum) {
        alert("Web3 Environment Undetected. To activate this voucher purchase, open this storefront link inside a Web3 app wrapper like the MetaMask Mobile Browser layer.");
        return;
    }
    if (targetContractAddress === "PASTE_YOUR_CONTRACT_ADDRESS_HERE") {
        alert("Storefront Standby: This action will route through the live blockchain contract as soon as the first buyer initializes the activation payload.");
        return;
    }
    try {
        const web3Provider = new ethers.providers.Web3Provider(window.ethereum);
        await web3Provider.send("eth_requestAccounts", []);
        const signerInstance = web3Provider.getSigner();
        
        // Structured tuple packaging formatted correctly as a JavaScript object parameter
        const voucherStruct = {
            tokenId: slotId,
            minPrice: "24543000000000000000000", // 24,543 POL in Wei
            uri: assetUri,
            signature: sigProof
        };
        const purchaseValueWei = "24543000000000000000000"; 
        
        const contractInstance = new ethers.Contract(targetContractAddress, voucherAbi, signerInstance);
        const transactionResult = await contractInstance.redeem(
            await signerInstance.getAddress(), 
            voucherStruct, 
            { value: purchaseValueWei }
        );
        
        alert("Voucher Activation Initialised! Tx Hash: " + transactionResult.hash);
    } catch(err) { 
        alert("Voucher Purchase Interrupted: " + err.message); 
    }
}
