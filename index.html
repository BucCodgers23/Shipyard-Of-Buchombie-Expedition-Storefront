<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Buchombie 7-in-1 Master Storefront</title>
    <!-- FIXED CDN: Resolves the loading asset block -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { font-family: monospace; background: #121212; color: #00ffcc; padding: 20px; margin: 0; }
        h1 { text-align: center; border-bottom: 2px solid #00ffcc; padding-bottom: 15px; letter-spacing: 1px; font-size: 1.5rem; }
        .contract-indicator { text-align: center; font-size: 0.85rem; color: #ff3366; margin-bottom: 25px; background: #22141a; padding: 8px; border: 1px dashed #ff3366; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #00ffcc; padding: 20px; border-radius: 6px; background: #1a1a1a; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 10px rgba(0, 255, 204, 0.05); }
        .card h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 5px; color: #ffffff; }
        .title-text { word-break: break-all; color: #00ffcc; }
        .cost-text { font-size: 1.1rem; color: #ffff00; margin: 15px 0 5px 0; }
        button { background: #00ffcc; color: #121212; border: none; padding: 12px 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; border-radius: 4px; font-family: monospace; transition: all 0.2s ease; }
        button:hover { background: #ffffff; box-shadow: 0 0 12px #00ffcc; }
    </style>
</head>
<body>

    <h1>BUCHOMBIE INTER-DIMENSIONAL ELEMENTAL INITIATE 7 ETERNAL</h1>
    <div class="contract-indicator">⚠️ CONFIGURATION REQUIRED: Replace placeholder with live address on deployment step.</div>
    <div class="grid" id="storefront"></div>

<script>
const contractAddress = "PASTE_YOUR_CONTRACT_ADDRESS_HERE";
const abi = ["function redeem(address redeemer, tuple(uint256 tokenId, uint256 minPrice, string uri, bytes signature) voucher) public payable returns (uint256)"];

const inventory = [
    { id: 1, title: "ANKHS-SPADES-Trailer-Edition-1-0", uri: "ipfs://bafkreidf3ikzrq5bdgbhrbsh7cr32m4rzs7o2oe6irkrkak4n5izxtbl2u", sig: "0x6f9c2d1b1014e36b62e4d5b694be31557d2a73abcb46da133074d11abcf9ca10" },
    { id: 2, title: "Thine-To-Be-In Final Skit-9-COIP100", uri: "ipfs://bafkreierbfw64rylqmimpbgo5w2knfza3drtqlh62kd7t5kgqlszer227e", sig: "0x7a2d3e4f5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e" },
    { id: 3, title: "CV The 1st 6ixth March Sovereign Plate", uri: "ipfs://bafkreig5pgujqu5ndlsjzrq5muluo3abggikyjijhkjxgnme7krzv2gpue", sig: "0x8b3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e" },
    { id: 4, title: "CV The 6ixth March Initial Years", uri: "ipfs://bafkreihabkcviyysansqp7p5qree5yo36dnfejifewcgfnqkdlnu33up3q", sig: "0x9c4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f" },
    { id: 5, title: "CRADLERI Visualisations Official IInd", uri: "ipfs://bafkreifc3nzkivdkvydwvqvyjjx2sbrls2ybdyo3cvlif72xrpmt7xaktq", sig: "0xa5f6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6" },
    { id: 6, title: "The Blue Avondales Presented by d'Rum", uri: "ipfs://bafkreieo6pyqnkj77zceeesw36erwyh2cexhrkx7dt5b6q5flzbsjlp7ei", sig: "0x6f5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b" },
    { id: 7, title: "CV To The Maidens Optimum Ultimate", uri: "ipfs://bafkreibkzupjunuvaavbjizophagz52qkujwakqpfvlluurfznmlwacnaa", sig: "0xc7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8" }
];

const container = document.getElementById("storefront");
inventory.forEach(item => {
    container.innerHTML += `
        <div class="card">
            <div>
                <h3>Work #${item.id}</h3>
                <p class="title-text"><strong>${item.title}</strong></p>
            </div>
            <div>
                <p class="cost-text">Cost: 24,543 POL</p>
                <button onclick="executeMint(${item.id}, '${item.uri}', '${item.sig}')">Mint Slot #${item.id}</button>
            </div>
        </div>
    `;
});

async function executeMint(id, uri, sig) {
    if (!window.ethereum) {
        alert("Web3 Provider missing. Open this page inside an ecosystem app like MetaMask Browser Layer.");
        return;
    }
    if (contractAddress === "PASTE_YOUR_CONTRACT_ADDRESS_HERE") {
        alert("Configuration Pointer: Enter your target deployment contract route first.");
        return;
    }
    try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        
        const voucher = { tokenId: id, minPrice: "24543000000000000000000", uri: uri, signature: sig };
        const valueToSend = "24543000000000000000000"; 
        
        const contract = new ethers.Contract(contractAddress, abi, signer);
        const tx = await contract.redeem(await signer.getAddress(), voucher, { value: valueToSend });
        alert("Broadcast Success! Transaction Hash: " + tx.hash);
    } catch(e) { 
        alert("Transaction Failed: " + e.message); 
    }
}
</script>
</body>
</html>
