            padding: 22px; 
            background: var(--tm-card-light); 
            display: flex;

            border-top: 4px solid var(--tm-blue-stencil);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 4px;

        .vendor-card:hover {

        .vendor-card h3 {

            color: var(--tm-blue-stencil); 
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            padding-bottom: 6px;
        }

            font-size: 11px;
            background: #f1f1f1;
            padding: 8px;
            border: 1px solid #e0e0e0;
            margin-top: 8px;
            border-radius: 3px;

        .price-matrix {

            color: var(--tm-gold-cost);

            margin: 15px 0 8px 0;

            border: 1px solid var(--tm-blue-stencil); 
            padding: 12px 20px;

            width: 100%; 
            margin-top: 12px; 
            font-family: inherit;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 3px;
            transition: all 0.15s ease;
        }
        
        .active-vendor-btn:hover { 
            background: #ffffff; 
            color: var(--tm-blue-stencil);
            border-color: var(--tm-blue-stencil);
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

            background: #ffffff; 
            border: 1px solid var(--tm-border-accent); 
            padding: 12px; 
            color: var(--tm-text-main); 
            font-family: inherit; 
            font-size: 13px; 
            box-sizing: border-box; 
            width: 100%;
            border-radius: 3px;
        }

        .time-machine-input:focus {
            border-color: var(--tm-blue-stencil);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 51, 204, 0.2);

</head>
